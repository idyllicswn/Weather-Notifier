name: Daily Weather Notifier

on:
  schedule:
    #7:00 AM Nepal Time (01:15 UTC)
    - cron: "15 1 * * *"

    # 12:00 PM Nepal Time (06:15 UTC)
    - cron: "15 6 * * *"

    #3:00 PM Nepal Time (09:15 UTC)
    - cron: "15 9 * * *"

    # 7:00 PM Nepal Time (13:15 UTC)
    - cron: "15 13 * * *"

  workflow_dispatch:

jobs:
  run-weather-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Weather Notifier
        run: python main.py

      - name: Keepalive Workflow
        uses: gautamkrishnar/keepalive-workflow@v2

      - name: Run Weather Notifier
        run: python main.py

      - name: Commit Updated Weather History
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: update daily weather history"
          file_pattern: "data/weather_history.csv"
