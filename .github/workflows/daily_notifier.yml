name: Daily Weather Notifier

on:
  schedule:
    # 7:00 AM Nepal Time (01:15 UTC)
    - cron: "15 1 * * *"
    # 12:00 PM Nepal Time (06:15 UTC)
    - cron: "15 6 * * *"
    # 3:00 PM Nepal Time (09:15 UTC)
    - cron: "15 9 * * *"
    # 7:00 PM Nepal Time (13:15 UTC)
    - cron: "15 13 * * *"
  workflow_dispatch:

jobs:
  run-weather-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Weather Notifier
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python main.py

      - name: Commit Weather History
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/
          git diff-index --quiet HEAD || git commit -m "auto: update daily weather history"
          git push
